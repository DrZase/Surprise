<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тут что-то будет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void: #060406;
    --terminal-bg: #120b0e;
    --terminal-border: #35262c;
    --terminal-header: #191115;
    --text-primary: #f3e9e4;
    --text-dim: #8f7d81;
    --accent: #e2916a;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --serif: 'Fraunces', serif;
  }

  * { box-sizing: border-box; }

  html{
    margin: 0;
    height: 100%;
    background: var(--bg-void);
    overflow: hidden;
  }

  body{
    margin: 0;
    height: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    position: relative;
  }

  /* фон */
  #bg-glow{
    position: absolute;
    inset: 0;
    z-index: -1;
    opacity: 0;
    background: linear-gradient(135deg, #2a1220, #7a2f4c, #d9738a, #f3bd8c);
    background-size: 300% 300%;
    animation: gradientDrift 24s ease-in-out infinite alternate;
    transition: opacity 6.5s cubic-bezier(.22,1,.36,1);
  }
  #bg-glow.visible{
    opacity: 1;
  }
  @keyframes gradientDrift{
    0%   { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
  }

  /* стартовый экран */
  #intro{
    position: fixed;
    inset: 0;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity .4s ease, transform .4s ease;
  }
  #intro.hide{
    opacity: 0;
    transform: scale(0.85);
    pointer-events: none;
  }

  /* вопрос */
  #question{
    font-family: var(--serif);
    font-size: clamp(3rem, 14vw, 5rem);
    color: var(--text-primary);
    opacity: 0;
    user-select: none;
    animation: fadeIn 1.2s ease forwards, pulse 2.6s ease-in-out 1.2s infinite;
    transition: filter .4s ease;
  }
  #intro:hover #question{
    filter: drop-shadow(0 0 18px rgba(226,145,106,0.55));
  }
  @keyframes fadeIn{ to{ opacity: 1; } }
  @keyframes pulse{
    0%, 100% { opacity: 1; }
    50%      { opacity: .55; }
  }

  /* терминал */
  #terminal{
    width: 90vw;
    max-width: 480px;
    background: var(--terminal-bg);
    border: 1px solid var(--terminal-border);
    border-radius: 3px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.5);
    opacity: 0;
    transform: scale(0.95) translateY(6px);
    transition: opacity .5s ease, transform .5s ease;
    overflow: hidden;
    position: absolute;
  }
  #terminal.visible{
    opacity: 1;
    transform: scale(1) translateY(0);
    position: relative;
  }

  .terminal-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 0 0 14px;
    background: var(--terminal-header);
    border-bottom: 1px solid var(--terminal-border);
  }
  .terminal-title{
    font-family: var(--mono);
    font-size: .72rem;
    color: var(--text-dim);
  }
  .win-controls{
    display: flex;
    align-items: stretch;
    height: 30px;
  }
  .win-btn{
    width: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: .68rem;
    color: var(--text-dim);
    user-select: none;
  }
  .win-btn.win-close{
    font-size: .6rem;
  }

  .terminal-body{
    padding: 20px 18px 24px;
    font-family: var(--mono);
    font-size: clamp(12.5px, 3.4vw, 14.5px);
    line-height: 1.65;
    color: var(--text-primary);
    min-height: 60px;
    text-align: left;
  }

  .prompt-line{ white-space: pre-wrap; word-break: break-word; }
  .prompt-user{ color: var(--accent); }
  .prompt-symbol{ color: var(--text-dim); }
  .cursor{
    display: inline-block;
    width: 7px;
    margin-left: 2px;
    background: var(--text-primary);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity: 0; } }

  #log{ margin-top: 6px; }
  .log-line{
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text-dim);
    opacity: 0;
    animation: lineIn .35s ease forwards;
  }
  .log-line .ok{ color: var(--accent); }
  .log-line .err{ color: #ff5f57; }
  .log-line.message{
    color: var(--text-primary);
    margin-top: 10px;
    font-style: italic;
  }
  .log-line.message.error{
    color: #ff8a80;
  }
  @keyframes lineIn{
    from{ opacity: 0; transform: translateY(3px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  /* подпись */
  #caption{
    font-family: var(--mono);
    font-weight: 600;
    font-size: clamp(1.5rem, 6.5vw, 2.4rem);
    letter-spacing: .3px;
    color: #fff8f2;
    text-shadow: 0 4px 30px rgba(0,0,0,0.25);
    opacity: 0;
    max-height: 0;
    margin-bottom: 0;
    overflow: hidden;
    white-space: nowrap;
    text-align: center;
    transition: opacity 1.4s cubic-bezier(.22,1,.36,1),
                max-height 1.4s cubic-bezier(.22,1,.36,1),
                margin-bottom 1.4s cubic-bezier(.22,1,.36,1);
  }
  #caption.visible{
    opacity: 1;
    max-height: 5rem;
    margin-bottom: 30px;
  }


  /* адаптация под разные экраны */
  @media (max-width: 480px){
    #terminal{
      width: calc(100vw - 24px);
      max-width: none;
      border-radius: 3px;
    }

    .terminal-header{
      padding: 0 0 0 11px;
    }

    .terminal-body{
      padding: 16px 13px 19px;
      font-size: 12px;
      line-height: 1.55;
    }

    .terminal-title{
      font-size: .65rem;
    }

    .win-controls{
      height: 26px;
    }

    .win-btn{
      width: 28px;
    }

    #caption{
      width: calc(100vw - 24px);
      white-space: normal;
      font-size: clamp(1.35rem, 8vw, 2rem);
      line-height: 1.2;
    }

    #caption.visible{
      margin-bottom: 22px;
    }
  }

  @media (min-width: 481px) and (max-width: 767px){
    #terminal{
      width: min(92vw, 520px);
    }

    .terminal-body{
      font-size: 13px;
    }
  }

  @media (min-width: 768px) and (max-width: 1199px){
    #terminal{
      width: min(88vw, 560px);
    }

    .terminal-body{
      padding: 22px 20px 26px;
      font-size: 14px;
    }

    #caption{
      font-size: clamp(1.8rem, 4vw, 2.6rem);
    }
  }

  @media (min-width: 1200px){
    #terminal{
      width: min(42vw, 620px);
    }

    .terminal-body{
      padding: 24px 22px 28px;
      font-size: 14px;
    }

    #caption{
      font-size: clamp(2rem, 3vw, 2.8rem);
    }
  }

  /* невысокие экраны: уменьшаем вертикальные отступы,
     чтобы окно целиком помещалось даже на 1366x768 */
  @media (max-height: 800px){
    #caption.visible{
      margin-bottom: 18px;
    }

    .terminal-body{
      padding-top: 16px;
      padding-bottom: 18px;
    }
  }

  @media (max-height: 650px){
    #caption.visible{
      margin-bottom: 12px;
    }

    #caption{
      font-size: clamp(1.35rem, 5vw, 2rem);
    }

    .terminal-body{
      padding-top: 12px;
      padding-bottom: 14px;
      line-height: 1.5;
    }
  }

  /* очень широкие мониторы */
  @media (min-width: 1920px){
    #terminal{
      max-width: 660px;
    }
  }

  @media (prefers-reduced-motion: reduce){
    #question{ animation: none; opacity: 1; }
    #bg-glow{ animation: none; transition-duration: .3s; }
    .log-line{ animation: none; opacity: 1; }
    #caption{ transition-duration: .3s; }
  }
</style>
</head>
<body>

  <div id="bg-glow"></div>

  <!-- Музыка: положите music.mp3 рядом с index.html -->
  <audio id="bg-music" loop preload="auto" aria-hidden="true">
    <source src="PoBarabanu.mp3" type="audio/mpeg">
  </audio>

  <div id="intro">
    <div id="question">?</div>
  </div>

  <div id="caption"><span id="caption-text"></span><span class="cursor" id="caption-cursor">▌</span></div>

  <div id="terminal">
    <div class="terminal-header">
      <span class="terminal-title">cmd</span>
      <div class="win-controls">
        <span class="win-btn">─</span>
        <span class="win-btn">□</span>
        <span class="win-btn win-close">✕</span>
      </div>
    </div>
    <div class="terminal-body">
      <div class="prompt-line">
        <span class="prompt-user">you@yana</span><span class="prompt-symbol">:~$ </span><span id="typed-command"></span><span class="cursor" id="cursor">▌</span>
      </div>
      <div id="log"></div>
    </div>
  </div>

<script>
  // текст можно поменять здесь
  const COMMAND = '/loveyana';
  const COMMAND_LOCKED = '/Search_Info';

  // дата, начиная с которой открывается успешная последовательность
  // (год, месяц с 0 — 8 значит сентябрь, день)
  const UNLOCK_DATE = new Date(2026, 8, 15, 0, 0, 0);

  const LOG_LINES = [
    '> подключение к сердцу...             <span class="ok">[OK]</span>',
    '> найдено причин любить тебя: ∞',
    '> загрузка модулей:',
    '    — твоя улыбка',
    '    — твоя память',
    '    — твои объятия',
    '    — твой дефицит общения',
    '    — твой нестабильный фон',
    '    — твои ошибки в сообщениях',
    '    — просто ты',
    '> статус: люблю                     <span class="ok">[TRUE]</span>',
    '> аптайм: 1 месяц · сбоев: 0'
  ];

  const FINAL_MESSAGE = 'Это только начало ♡';
  const CAPTION_TEXT = 'Люблю тебя ♡';
  const ERROR_MESSAGE = "1508 It's still early";

  // анимация всегда идёт на полной скорости, независимо от системной
  // настройки «Уменьшение движения» на устройстве получателя
  const reduceMotion = false;
  const wait = ms => new Promise(resolve => setTimeout(resolve, reduceMotion ? Math.min(ms, 60) : ms));

  const random = (min, max) => Math.random() * (max - min) + min;

  function typeText(el, text, speed){
    return new Promise(resolve => {
      let i = 0;
      if(reduceMotion){ el.textContent = text; return resolve(); }
      (function step(){
        if(i < text.length){
          el.textContent += text[i];
          i++;
          let delay = speed * random(0.7, 1.5);
          if(Math.random() < 0.06) delay += random(200, 450);
          setTimeout(step, delay);
        } else resolve();
      })();
    });
  }

  async function progress(el, totalTime, maxPercent = 100){
    let percent = 0;
    const width = 22;
    const start = Date.now();
    while(percent < maxPercent){
      if(reduceMotion){ percent = maxPercent; }
      else{
        const remaining = Math.max(0, totalTime - (Date.now() - start));
        const step = remaining < 400 ? random(12, 28) : random(2, 6);
        percent = Math.min(maxPercent, percent + step);
      }
      const filled = Math.round((percent / 100) * width);
      const bar = '▓'.repeat(filled) + '░'.repeat(width - filled);
      el.textContent = `[${bar}] ${Math.floor(percent)}%`;
      await wait(reduceMotion ? 20 : random(180, 400));
    }
  }

  async function runSequence(){
    const cmdEl = document.getElementById('typed-command');
    const unlocked = new Date() >= UNLOCK_DATE;
    const commandText = unlocked ? COMMAND : COMMAND_LOCKED;

    await wait(500);
    await typeText(cmdEl, commandText, 170); // медленная, живая печать
    await wait(750);
    document.getElementById('cursor').style.display = 'none';

    const log = document.getElementById('log');

    // небольшой прогресс
    const analysis = document.createElement('div');
    analysis.className = 'log-line';
    analysis.textContent = '> анализ системы...';
    log.appendChild(analysis);
    await wait(reduceMotion ? 50 : 550);

    if(!unlocked){
      // ветка "ещё рано": прогресс застревает на 99% и падает с ошибкой,
      // фон и подпись не трогаем — всё остаётся в исходном состоянии
      const bar = document.createElement('div');
      bar.className = 'log-line';
      log.appendChild(bar);
      await progress(bar, reduceMotion ? 100 : 3600, 99);

      await wait(reduceMotion ? 50 : 450);
      const err = document.createElement('div');
      err.className = 'log-line';
      err.innerHTML = '> анализ прерван                      <span class="err">[ERROR]</span>';
      log.appendChild(err);
      await wait(reduceMotion ? 50 : 500);

      const errMsg = document.createElement('div');
      errMsg.className = 'log-line message error';
      errMsg.textContent = ERROR_MESSAGE;
      log.appendChild(errMsg);
      return;
    }

    const bar = document.createElement('div');
    bar.className = 'log-line';
    log.appendChild(bar);
    await progress(bar, reduceMotion ? 100 : 4800);

    // одновременно начинаем менять фон и включаем музыку
    document.getElementById('bg-glow').classList.add('visible');

    // Музыка не должна иметь возможности остановить основную последовательность.
    // Если audio отсутствует, файл не найден или браузер блокирует autoplay —
    // сайт всё равно продолжает выполнять все следующие анимации.
    const music = document.getElementById('bg-music');

    if (music) {
      try {
        // Аудио уже было запущено в момент клика, поэтому здесь только
        // включаем слышимую громкость.
        music.volume = 0.2;
      } catch (error) {
        // Любая ошибка аудио не должна прерывать runSequence().
        console.warn('Музыка недоступна:', error);
      }
    }

    await wait(reduceMotion ? 50 : 450);
    const done = document.createElement('div');
    done.className = 'log-line';
    done.innerHTML = '> анализ завершён                     <span class="ok">[OK]</span>';
    log.appendChild(done);
    await wait(reduceMotion ? 50 : 600);


    for(const line of LOG_LINES){
      const div = document.createElement('div');
      div.className = 'log-line';
      div.innerHTML = line;
      log.appendChild(div);
      await wait(reduceMotion ? 30 : 380);
    }

    await wait(650);
    const msgDiv = document.createElement('div');
    msgDiv.className = 'log-line message';
    log.appendChild(msgDiv);
    await wait(200);
    await typeText(msgDiv, FINAL_MESSAGE, 75);

    // показываем подпись
    await wait(1000);
    document.getElementById('caption').classList.add('visible');
    await wait(700);
    await typeText(document.getElementById('caption-text'), CAPTION_TEXT, 90);
  }

  document.getElementById('intro').addEventListener('click', async () => {
    const intro = document.getElementById('intro');
    intro.classList.add('hide');
    await wait(400);
    intro.style.display = 'none';
    document.getElementById('terminal').classList.add('visible');

    // Запускаем аудио непосредственно внутри пользовательского клика.
    // Браузеры разрешают это, в отличие от play() спустя несколько await.
    // До достижения 100% звук будет полностью выключен.
    const music = document.getElementById('bg-music');
    if (music) {
      try {
        music.volume = 0;
        const playPromise = music.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(error => {
            console.warn('Не удалось запустить музыку:', error);
          });
        }
      } catch (error) {
        console.warn('Музыка недоступна:', error);
      }
    }

    // Не даём необработанной ошибке молча оборвать весь сценарий.
    runSequence().catch(error => {
      console.error('Ошибка последовательности:', error);
    });
  });
</script>

</body>
</html>
